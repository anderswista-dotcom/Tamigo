<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tamigo</title>
<style>
:root{--or:#fdb25d;--cor:#f26d4f;--ind:#3f45a8;--lav:#f0f1f9;--line:#e3e5ec;--tx:#2a2c33;--mut:#6b7080;--acc:var(--or);--bad:#d64545;--ok:#2f9e6b;--rowh:46px;--namew:190px}
*{box-sizing:border-box}
body{margin:0;padding:6px;height:100vh;background:#fff;font:13px/1.35 Nunito,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tx)}
#app{height:100%;border:1.5px solid #fdc08b;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
#top{height:70px;flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#fff}
.logo{width:200px;display:flex;align-items:center;padding-left:36px;font-size:34px;font-weight:600;color:var(--cor);letter-spacing:-1px}
.bell{width:70px;display:flex;align-items:center;justify-content:center;color:var(--cor);font-size:18px}
#tn{display:flex;gap:2px;align-items:stretch;padding-left:10px}
#tn a{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#66697a;cursor:pointer;font-size:12.5px;border-bottom:2px solid transparent;margin-top:2px}
#tn a svg{width:26px;height:26px;stroke:#777b8a;fill:none;stroke-width:1.3}
#tn a.on{color:var(--cor);border-bottom-color:var(--cor)}#tn a.on svg{stroke:var(--cor)}
.sp{flex:1}
.yl{width:152px;background:var(--or);color:#fff;padding:0 18px;display:flex;align-items:center;font-size:13px;opacity:.95;line-height:1.5}
.org{width:100px;display:flex;align-items:center;justify-content:center}.org i{width:46px;height:46px;border:1.5px solid var(--or);border-radius:50%;display:block}
#body{flex:1;display:flex;min-height:0}
aside{width:226px;flex:none;background:#f7f7fb;display:flex;flex-direction:column}
#prof{background:var(--or);color:#fff;height:146px;padding:20px 22px;flex:none}
#prof .r{display:flex;gap:12px;align-items:center}#prof .av{width:44px;height:44px;border-radius:50%;background:#8a8f9d;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-weight:700}
#prof b{font-weight:600;font-size:14px;display:block}#prof small{font-size:11px;font-weight:600}
#prof .ad{margin-top:42px;font-size:14px;display:flex;justify-content:space-between}
#sub{margin:20px 0 0 18px;border-left:1.5px solid #e4e6ee;padding:0;list-style:none;overflow:auto;flex:1}
#sub li{padding:0 22px;height:44px;line-height:44px;color:#5b5f6f;font-size:14.5px;cursor:pointer;position:relative}
#sub li.on:before{content:"";position:absolute;left:-2px;top:0;bottom:0;width:3px;background:var(--cor)}
#sub li:hover{color:#000}
#main{flex:1;background:var(--lav);padding:28px 26px;overflow:auto;min-width:0}
#panel{background:#fff;min-height:100%;border-radius:3px}
#hdr:not(:empty){padding:14px 26px;border-bottom:1px solid var(--line)}
#view{padding:18px 26px 40px}
.tb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tb2{display:flex;align-items:center;padding:20px 0 0}
.rb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#f1f2f7;color:#666;cursor:pointer;font-size:16px}
.rb.pr{background:var(--ind);color:#fff;border-color:var(--ind)}
.dp input{height:40px;width:158px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit;font-size:14.5px}
.ck{display:flex;align-items:center;gap:9px;font-size:14.5px;margin-left:8px}.ck input{width:20px;height:20px;accent-color:var(--ind)}
.lnk{color:var(--ind);cursor:pointer;font-size:14.5px}
.pill-b{height:38px;padding:0 17px;border-radius:19px;border:1.5px solid var(--ind);background:#fff;color:var(--ind);font:inherit;font-size:14.5px;cursor:pointer;margin-left:12px}
.pill-b.f{background:var(--ind);color:#fff}
.tsw{display:grid;grid-template-columns:1fr 245px;gap:26px;align-items:start}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:8px 0 18px}
.dt{background:#b6dfb6;color:#fff;text-align:center;padding:13px 0;border-radius:2px;cursor:pointer;font-size:14.5px;line-height:1.4;height:72px}
.dt.on{background:#7cc47c}.dt.cl{background:#c9cbd3}.dt.cl.on{background:#9a9eae}
.ts{width:100%;border-collapse:collapse;border:1px solid var(--line);font-size:13px}
.ts caption{text-align:left;font-size:17px;padding:12px 13px;border:1px solid var(--line);border-bottom:0}
.ts th,.ts td{border:1px solid var(--line);height:36px;padding:0 9px;font-weight:400;text-align:left;white-space:nowrap}
.ts th.g{height:44px}.ts td.r,.ts th.r{text-align:right}
.ts td.pc{position:relative}.ts td i{font-style:normal;font-size:9px;position:absolute;top:3px;right:8px;background:#0000000d;padding:0 4px;border-radius:5px}
.ts td.w{cursor:pointer;color:#8a8e9c}.ts td.wh{font-weight:400;cursor:pointer;text-align:right}
.ts .g1{background:#8fd18f;color:#fff}.ts .y1{background:#ffe082}.ts .r1{background:#f87171;color:#fff}
.ts tr.gr td{background:#f4f5f8;font-weight:600}.ts tr.tot td{border-top:2px solid var(--line);height:38px}
.side{margin-top:76px}.card{background:#f4f5f9;padding:14px 14px 16px;margin-bottom:18px;text-align:center}
.card h4{margin:0 0 10px;font-weight:400;font-size:13px}.card textarea{width:100%;height:106px;border:1px solid var(--line);border-radius:6px;resize:none;font:inherit}
.card input{width:100%;border:0;background:none;text-align:center;font:inherit;font-size:26px}
/* planner, tables, modal */
.grid{display:grid;grid-template-columns:var(--namew) repeat(7,minmax(104px,1fr)) 70px;background:#fff;border:1px solid var(--line);min-width:1000px}
.grid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gh{background:#f7f8fa;padding:6px 8px;font-weight:600;position:sticky;top:0;z-index:2}.gh small{display:block;font-weight:400;color:var(--mut)}.gh.today{background:#fff3e0}.gh.sel{box-shadow:inset 0 -3px var(--or)}
.dep{grid-column:1/-1;background:#eceef4;padding:4px 8px;font-weight:600;font-size:12px}
.nm{padding:6px 8px;display:flex;flex-direction:column;justify-content:center;min-height:var(--rowh)}.nm small{color:var(--mut)}
.cell{min-height:var(--rowh);padding:3px;display:flex;flex-direction:column;gap:3px;cursor:cell}.cell:hover{background:#fff8ec}.cell.over{background:#ffe9c4}
.cell.abs{background:repeating-linear-gradient(45deg,#f1f2f4,#f1f2f4 6px,#fff 6px,#fff 12px)}
.tot{padding:6px 8px;text-align:right;font-weight:600;display:flex;align-items:center;justify-content:flex-end}.tot.warn{color:var(--bad)}
.sh{border-radius:3px;padding:3px 6px;color:#fff;font-size:12px;cursor:grab;border-left:4px solid #0003}.sh small{display:block;opacity:.9;font-size:11px}
.sh.conf{outline:2px solid var(--bad);background-image:repeating-linear-gradient(135deg,#0000 0 5px,#ff000030 5px 10px)}.sh.draft{opacity:.8}
.foot{background:#f7f8fa;padding:5px 8px;font-size:12px;color:var(--mut)}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;background:#e5e7eb}.pill.pub{background:#d6f0e3;color:#1d6b49}.pill.pen{background:#fdf0c4;color:#8a6500}.pill.no{background:#f8d9d9;color:#a02f2f}
.btn{border:1px solid var(--ind);background:#fff;color:var(--ind);padding:6px 14px;border-radius:18px;cursor:pointer;font:inherit}.btn.p{background:var(--ind);color:#fff}.btn.d{color:var(--bad);border-color:var(--bad)}
input,select{font:inherit;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
table:not(.ts){width:100%;border-collapse:collapse;border:1px solid var(--line)}
table:not(.ts) th{background:#f7f8fa;text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}table:not(.ts) td{padding:7px 10px;border-bottom:1px solid var(--line)}
.mb{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;z-index:20}
.md{background:#fff;width:380px;border-radius:6px;box-shadow:0 8px 30px #0004}.md h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.md .bd{padding:14px 16px;display:grid;grid-template-columns:110px 1fr;gap:9px;align-items:center}.md .ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.err{grid-column:1/-1;color:var(--bad)}.stub{color:var(--mut);padding:30px 0}
#toast{position:fixed;bottom:22px;right:22px;background:#2a2c33;color:#fff;padding:9px 14px;border-radius:4px;display:none;z-index:30}
@media print{#top,aside,#hdr{display:none}body{padding:0}#app{border:0}}

html{-webkit-text-size-adjust:100%}
.xs{overflow-x:auto}
@media (max-width:820px){
 body{padding:0;height:100vh;height:100dvh}
 #app{border:0;border-radius:0}
 #top{height:58px}.bell,.yl,.org,#top>.sp{display:none}
 .logo{width:auto;padding:0 12px;font-size:24px}
 #tn{flex:1;overflow-x:auto;padding-left:0;gap:0;scrollbar-width:none}#tn::-webkit-scrollbar{display:none}
 #tn a{flex:none;width:74px;font-size:11px;gap:3px;margin-top:0}#tn a svg{width:22px;height:22px}#tn a[style]{margin-left:0!important}
 #body{flex-direction:column}
 aside{width:100%;flex:none}
 #prof{height:auto;padding:8px 14px}#prof .ad{display:none}#prof .av{width:30px;height:30px;font-size:13px}#prof small{display:none}
 #sub{display:flex;flex-direction:row;overflow-x:auto;margin:0;border-left:0;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
 #sub::-webkit-scrollbar{display:none}
 #sub li{flex:none;height:40px;line-height:40px;padding:0 14px;font-size:13.5px;white-space:nowrap}
 #sub li.on:before{left:0;right:0;top:auto;bottom:0;width:auto;height:3px}
 #main{padding:8px}#panel{overflow-x:hidden}
 #hdr:not(:empty){padding:10px 12px}#view{padding:12px;overflow-x:auto}
 .tb{gap:8px}.ck{margin-left:0;font-size:13.5px}.ck input{width:18px;height:18px}
 .dp input{width:140px;height:38px}
 .tb2{flex-wrap:wrap;gap:8px}.pill-b{margin-left:0;height:36px;padding:0 13px;font-size:13.5px}
 .tsw{grid-template-columns:1fr;gap:14px}.side{margin-top:0}
 .days{grid-template-columns:repeat(7,86px);overflow-x:auto;margin-bottom:12px}.dt{height:60px;padding:9px 0;font-size:13px}
 .ts{min-width:640px}
 .grid{min-width:880px;--namew:120px}
 .md{width:92vw}.mb{padding-top:24px}.md .bd{grid-template-columns:88px 1fr}
 input,select,textarea{font-size:16px}
 .btn{padding:7px 12px}
}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stats .card{margin:0;padding:18px 12px}.stats .card b{display:block;font-size:30px;font-weight:400;margin-top:6px}
.nw{border-bottom:1px solid var(--line);padding:12px 0}.nw small{color:var(--mut);margin-left:8px}.nw p{margin:6px 0 0}.fm{display:flex;flex-direction:column;gap:8px;max-width:520px;margin-top:20px}.fm textarea{height:70px;border:1px solid var(--line);border-radius:5px;font:inherit;padding:6px 8px}
h3.sec{margin:26px 0 10px;font-weight:600;font-size:15px}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="app"><div id="top"><div class="logo">tamigo</div><div class="bell">🔔︎</div><div id="tn"></div><div class="sp"></div><div class="yl">your logo?<br>contact tamigo</div><div class="org"><i></i></div></div>
<div id="body"><aside><div id="prof"><div class="r"><div class="av">S</div><div><b>Sarah Smith</b><small>⚲ København</small></div></div><div class="ad"><span>Administrator ▾</span><span>⇥</span></div></div><ul id="sub"></ul></aside>
<div id="main"><div id="panel"><div id="hdr"></div><div id="view"></div></div></div></div></div>
<div id="toast"></div><div id="modal"></div>
<script>

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const dur=s=>Math.max(0,(mins(s.e)-mins(s.s)-(+s.brk||0))/60);
const fmt=h=>(Math.round(h*10)/10).toString().replace('.',',');
const DN=['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
const DEPS={Butik:'#3b82c4',Lager:'#8a6bbf',Kasse:'#2f9e6b'};
const uid=()=>Math.random().toString(36).slice(2,9);

function seed(){
 const emps=[['Anna Jensen','Butik',37],['Mads Holm','Butik',30],['Sofie Berg','Kasse',37],['Jonas Kruse','Kasse',20],['Emil Dahl','Lager',37],['Laura Nygaard','Lager',25],['Peter Lund','Butik',15]]
  .map(([name,dep,contract],i)=>({id:'e'+i,name,dep,contract,email:name.split(' ')[0].toLowerCase()+'@firma.dk',active:true}));
 const w=monday(new Date()),shifts=[];
 emps.forEach((e,i)=>{for(let d=0;d<5;d++){if((d+i)%4===3)continue;const early=(d+i)%2===0;
  shifts.push({id:uid(),emp:e.id,date:addD(w,d),s:early?'08:00':'12:00',e:early?'16:00':'20:00',brk:30,dep:e.dep})}});
 shifts.push({id:uid(),emp:null,date:addD(w,5),s:'10:00',e:'18:00',brk:30,dep:'Butik'});
 return{emps,shifts,abs:[{id:uid(),emp:'e1',from:addD(w,2),to:addD(w,3),type:'Ferie',status:'Afventer'}],
  pub:{},reg:{}};
}
let S=(()=>{try{return JSON.parse(localStorage.getItem('vp1'))||seed()}catch(e){return seed()}})();
S.wk=S.wk||{};S.closed=S.closed||{};
let ST={page:'time',week:monday(new Date()),day:iso(new Date()),sel:null,dep:'',q:'',draft:null};
function save(){try{localStorage.setItem('vp1',JSON.stringify(S));return true}catch(e){toast('Kunne ikke gemme: '+e.message);return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}
const emp=id=>S.emps.find(e=>e.id===id);
const absOn=(id,d)=>S.abs.find(a=>a.emp===id&&a.status==='Godkendt'&&a.from<=d&&d<=a.to);
function conflicts(sh){return S.shifts.filter(o=>o.id!==sh.id&&sh.emp&&o.emp===sh.emp&&o.date===sh.date&&mins(o.s)<mins(sh.e)&&mins(sh.s)<mins(o.e)).length>0}


const I={information:'<circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.5"/>',employees:'<circle cx="12" cy="9" r="3"/><circle cx="6" cy="10" r="2.3"/><circle cx="18" cy="10" r="2.3"/><path d="M6.5 18c0-3 11-3 11 0"/>',rota:'<rect x="5" y="5" width="14" height="14"/><path d="M5 9h14M8 13h8M8 16h8"/>',timesheet:'<rect x="6" y="4" width="12" height="16" rx="1"/><path d="M9 8h6M9 12h6M9 16h3"/>',swap:'<path d="M4 9h15l-3-3M20 15H5l3 3"/>',absence:'<circle cx="9" cy="9" r="3"/><path d="M4 19c0-5 10-5 10 0"/><path d="M16 5l3 1M17 9h3" />',financials:'<rect x="5" y="9" width="4" height="10"/><rect x="11" y="5" width="4" height="14"/><path d="M17 12h3v7h-3"/>',configuration:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" stroke-dasharray="3 2"/>',help:'<circle cx="12" cy="12" r="8"/><path d="M10 10a2 2 0 114 0c0 1.5-2 1.5-2 3M12 16.5v.5"/>'};
const PAGES=[['info','Information','information'],['emps','Employees','employees'],['plan','Rota','rota'],['time','Timesheet','timesheet'],['swap','Shift Exchange','swap'],['abs','Absence','absence'],['fin','Financials','financials'],['cfg','Configuration','configuration']];
const SUB={time:['Hours Worked','Hours Worked (week)','Unitec File','Tips','Check In/Out','Timesheet Sign-Off','Payroll Export','Approve Differences','Invoice Export','Reporting Forms','Absence Export','Working Now','Salary Details','Monthly Overview','Shifts & Breaks','Add Registration'],plan:['Rota'],emps:['Employee list'],abs:['Absence requests'],info:['News & overview'],swap:['Requests'],fin:['Revenue & wages'],cfg:['Departments & settings']};
function nav(){
 $('#tn').innerHTML=PAGES.map(([k,l,i])=>`<a class="${ST.page===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${I[i]}</svg>${l}</a>`).join('')+`<a style="margin-left:60px" onclick="toast('Help is not part of this demo')"><svg viewBox="0 0 24 24">${I.help}</svg>Help</a>`;
 $('#sub').innerHTML=(SUB[ST.page]||[]).map((t,i)=>`<li class="${i===0?'on':''}" onclick="${i?`toast('${t.replace(/'/g,'')}: not built in this demo')`:''}">${t}</li>`).join('')}
function go(p){ST.page=p;render()}
function render(){nav();$('#hdr').innerHTML='';const f={plan,emps,time,abs,info,swap,fin,cfg}[ST.page];
 if(f)f();else $('#view').innerHTML='<p class="stub">This module is not built in this demo.</p>'}
/* ---------- PLANNER ---------- */
function plan(){
 const days=[...Array(7)].map((_,i)=>addD(ST.week,i)),today=iso(new Date());
 const pub=!!S.pub[ST.week];
 $('#hdr').innerHTML=`<button class="btn" onclick="wk(-7)">‹</button><button class="btn" onclick="ST.week=monday(new Date());render()">I dag</button><button class="btn" onclick="wk(7)">›</button>
 <input type="date" value="${ST.week}" onchange="ST.week=monday(parse(this.value));render()">
 <b>Uge ${isoWeek(parse(ST.week))}</b>
 <select onchange="ST.dep=this.value;render()"><option value="">Alle afdelinger</option>${Object.keys(DEPS).map(d=>`<option ${ST.dep===d?'selected':''}>${d}</option>`).join('')}</select>
 <span class="pill ${pub?'pub':'pen'}">${pub?'Publiceret':'Kladde'}</span><span class="sp"></span>
 <button class="btn" onclick="editShift(null,null,'${ST.sel||ST.week}')">+ Ny vagt</button>
 <button class="btn p" onclick="publish()">${pub?'Træk tilbage':'Publicér'}</button>`;
 let h=`<div class="grid"><div class="gh">Medarbejder</div>`+days.map((d,i)=>`<div class="gh ${d===today?'today':''} ${d===ST.sel?'sel':''}" onclick="ST.sel='${d}';render()">${DN[i]} <small>${parse(d).getDate()}/${parse(d).getMonth()+1}</small></div>`).join('')+`<div class="gh" style="text-align:right">Timer</div>`;
 const rowsFor=dep=>S.emps.filter(e=>e.active&&e.dep===dep);
 const deps=Object.keys(DEPS).filter(d=>!ST.dep||d===ST.dep);
 const wkShifts=S.shifts.filter(s=>s.date>=ST.week&&s.date<=days[6]);
 deps.forEach(dep=>{
  h+=`<div class="dep">${dep}</div>`;
  rowsFor(dep).forEach(e=>{
   const tot=wkShifts.filter(s=>s.emp===e.id).reduce((a,s)=>a+dur(s),0);
   h+=`<div class="nm">${e.name}<small>Kontrakt ${e.contract} t/uge</small></div>`+days.map(d=>cell(e.id,d)).join('')+
   `<div class="tot ${tot>e.contract+0.01?'warn':''}" title="Kontrakt ${e.contract} t">${fmt(tot)}</div>`;
  });
 });
 const open=wkShifts.filter(s=>!s.emp&&(!ST.dep||s.dep===ST.dep));
 h+=`<div class="dep">Ubemandede vagter</div><div class="nm">Åbne vagter</div>`+days.map(d=>cell(null,d)).join('')+`<div class="tot">${fmt(open.reduce((a,s)=>a+dur(s),0))}</div>`;
 h+=`<div class="foot" style="grid-column:1">Timer pr. dag</div>`+days.map(d=>`<div class="foot">${fmt(wkShifts.filter(s=>s.date===d&&(!ST.dep||s.dep===ST.dep)).reduce((a,s)=>a+dur(s),0))} t</div>`).join('')+`<div class="foot"></div></div>`;
 $('#view').innerHTML=h;
 function cell(eid,d){
  const ab=eid&&absOn(eid,d);
  const items=wkShifts.filter(s=>s.emp===eid&&s.date===d&&(!ST.dep||s.dep===ST.dep));
  return `<div class="cell ${ab?'abs':''}" data-e="${eid||''}" data-d="${d}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,this)" onclick="if(event.target===this)editShift(null,${eid?`'${eid}'`:null},'${d}')">`+
   (ab?`<span class="pill no">${ab.type}</span>`:'')+items.map(s=>`<div class="sh ${conflicts(s)?'conf':''} ${pub?'':'draft'}" style="background:${DEPS[s.dep]}" draggable="true" ondragstart="event.dataTransfer.setData('t','${s.id}')" onclick="editShift('${s.id}')" title="${conflicts(s)?'Overlap med anden vagt':'Pause '+s.brk+' min'}">${s.s}–${s.e}<small>${s.dep} · ${fmt(dur(s))} t${s.brk?' · pause '+s.brk:''}</small></div>`).join('')+`</div>`;
 }
}

function abs(){
 $('#hdr').innerHTML=`<span class="sp"></span><button class="btn p" onclick="editAbs()">+ Fraværsanmodning</button>`;
 $('#view').innerHTML=S.abs.length?`<table><tr><th>Medarbejder</th><th>Type</th><th>Fra</th><th>Til</th><th>Status</th><th></th></tr>`+S.abs.map(a=>`<tr><td>${emp(a.emp)?.name||'?'}</td><td>${a.type}</td><td>${a.from}</td><td>${a.to}</td><td><span class="pill ${a.status==='Godkendt'?'pub':a.status==='Afvist'?'no':'pen'}">${a.status}</span></td><td>${a.status==='Afventer'?`<button class="btn" onclick="setAbs('${a.id}','Godkendt')">Godkend</button> <button class="btn d" onclick="setAbs('${a.id}','Afvist')">Afvis</button>`:''}</td></tr>`).join('')+`</table>`:'<p>Ingen fraværsanmodninger.</p>'}
function setAbs(id,st){S.abs.find(a=>a.id===id).status=st;save();abs()}
function editAbs(){$('#modal').innerHTML=`<div class="mb"><div class="md"><h3>Fraværsanmodning</h3><div class="bd"><label>Medarbejder</label><select id="e">${S.emps.filter(e=>e.active).map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select>
 <label>Type</label><select id="t"><option>Ferie</option><option>Sygdom</option><option>Orlov</option></select><label>Fra</label><input type="date" id="f"><label>Til</label><input type="date" id="to"><div class="err" id="f_err"></div></div>
 <div class="ft"><button class="btn p" onclick="saveAbs()">Send</button><button class="btn" onclick="closeM()">Annuller</button></div></div></div>`}
function saveAbs(){const f=$('#f').value,t=$('#to').value;if(!f||!t||t<f){$('#f_err').textContent='Angiv en gyldig periode.';return}
 S.abs.push({id:uid(),emp:$('#e').value,type:$('#t').value,from:f,to:t,status:'Afventer'});save();closeM();abs()}

/* ---------- REPORTS ---------- */
function rep(){
 $('#hdr').innerHTML=`<button class="btn" onclick="wk(-7)">‹</button><button class="btn" onclick="wk(7)">›</button><b>Uge ${isoWeek(parse(ST.week))}</b>`;
 const sh=S.shifts.filter(s=>s.date>=ST.week&&s.date<=addD(ST.week,6));
 $('#view').innerHTML=`<table><tr><th>Medarbejder</th><th>Afdeling</th><th>Planlagt (t)</th><th>Kontrakt (t)</th><th>Differens</th></tr>`+S.emps.filter(e=>e.active).map(e=>{const t=sh.filter(s=>s.emp===e.id).reduce((a,s)=>a+dur(s),0);const d=t-e.contract;
 return`<tr><td>${e.name}</td><td>${e.dep}</td><td>${fmt(t)}</td><td>${e.contract}</td><td style="color:${d>0?'var(--bad)':'inherit'}">${d>0?'+':''}${fmt(d)}</td></tr>`}).join('')+`</table>`}
seed2();render();
</script></body></html>
